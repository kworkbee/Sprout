apiVersion: v1
kind: Namespace
metadata:
  name: sprout-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sprout-operator
  namespace: sprout-system
  labels: {app.kubernetes.io/name: sprout-operator}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: sprout-operator}
  template:
    metadata:
      labels: {app.kubernetes.io/name: sprout-operator}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: sprout-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: manager
          image: sprout-operator:dev
          imagePullPolicy: IfNotPresent
          env:
            - {name: SPRING_PROFILES_ACTIVE, value: prod}
            - {name: SPROUT_INGRESS_DOMAIN, value: localhost}
            - {name: SPROUT_INGRESS_PORT, value: "8080"}
          ports:
            - {name: metrics, containerPort: 8081}
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
            initialDelaySeconds: 20
          readinessProbe:
            httpGet: {path: /readyz, port: metrics}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {}}
