name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: ktlint, detekt, tests (Kotest, kube-apiserver) and 100% coverage gate
        run: ./gradlew check
      - name: CRD is up to date
        run: |
          ./gradlew generateCrd
          git diff --exit-code config/crd

  e2e:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - name: Kind end-to-end and fault injection
        run: test/e2e/run.sh
